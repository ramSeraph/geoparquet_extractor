name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm version ${GITHUB_REF_NAME#v} --no-git-tag-version --allow-same-version
      - run: npm run lint
      - run: npm test
      - run: npm run test:package -- --browser chromium
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: .artifacts/geoparquet-extractor-*.tgz
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0

  verify-webkit:
    needs: verify
    # Real WebKit OPFS requires the macOS runner; ordinary WebKit tests run above.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: .artifacts
      - run: npm run test:package -- --browser webkit --tarball ".artifacts/geoparquet-extractor-${GITHUB_REF_NAME#v}.tgz"

  publish:
    needs: [verify, verify-webkit]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: .artifacts
      - name: Publish the verified tarball
        run: npm publish ".artifacts/geoparquet-extractor-${GITHUB_REF_NAME#v}.tgz" --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} --generate-notes
